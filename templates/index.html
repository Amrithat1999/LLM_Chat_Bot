<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple AI Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        h2 { color: #333; }

        #chat-box {
            width: 550px;
            height: 450px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .message {
            margin: 12px 0;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-text {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .bot-text {
            background-color: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .input-group {
            display: flex;
            width: 590px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 16px;
        }

        input:focus { border-color: #0084ff; }

        button {
            padding: 10px 25px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background: #0073e6; }
        
        .loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h2>🤖 AI Assistant</h2>

    <div id="chat-box" style="display: flex; flex-direction: column;">
        <div class="message bot-text"><b>Bot:</b> Hello! Ask me anything.</div>
    </div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="Type a message and press Enter..." 
               onkeydown="if(event.key === 'Enter') send()">
        <button onclick="send()">Send</button>
    </div>

    <script>
        async function send() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();

            if (!text) return;

            // 1. Display User Message
            chatBox.innerHTML += `<div class="message user-text">${text}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Display "Thinking..." placeholder
            const tempId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${tempId}" class="message bot-text loading">Thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. Call Flask API
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: text})
                });
                
                const data = await response.json();

                // 4. Update placeholder with real AI response
                const loadingDiv = document.getElementById(tempId);
                loadingDiv.classList.remove("loading");
                loadingDiv.innerHTML = `<b>Bot:</b> ${data.response}`;
                
            } catch (e) {
                document.getElementById(tempId).innerText = "Error: Could not connect to AI.";
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>
